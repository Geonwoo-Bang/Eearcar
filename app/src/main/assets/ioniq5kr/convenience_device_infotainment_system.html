          <h2 id="38635c01-3ee2-43e6-9259-9669ef52e531" class=" ">인포테인먼트 시스템 이용하기</h2>
          <p class=" ">다양한 미디어를 청취하고 사용 환경을 설정할 수 있습니다.</p>
          <div type="warning" class=" note ">
            <p class=" ">유리창을 닫고 큰 음량으로 미디어를 청취하는 경우, 외부 소리를 들을 수 없어 매우 위험합니다. 과도한 미디어 음량 사용을 피하고, 교차로나 건널목 주행 시 특히 주의하십시오.</p>
          </div>
          <div type="note" class=" note ">
            <p class=" ">업데이트로 인해 인포테인먼트 시스템의 상세 설정이 변경될 수 있습니다. 자세한 설정 방법은 인포테인먼트 시스템 웹 매뉴얼을 참고하십시오.</p>
          </div>
