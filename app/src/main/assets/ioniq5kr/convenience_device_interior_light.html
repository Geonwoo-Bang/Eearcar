          <h2 id="5f1fdb54-6b79-4c13-935e-1756d3764a6c" class=" ">실내등</h2>
          <p class=" ">차량 내부에 설치된 조명의 위치와 작동 방식을 확인하십시오.</p>
          <div type="caution" class=" note ">
            <ul class=" ">
              <li class=" ">
                <p class=" ">실내등을 켠 채 어두운 곳을 주행하지 마십시오. 실내등은 어두운 곳에서 운전자의 시야 확보를 방해해 사고 위험을 높입니다.</p>
              </li>
              <li class=" ">
                <p class=" ">차량을 떠나기 전 모든 실내 조명이 꺼져 있는지 확인하십시오. 시동이 꺼진 상태로 실내등을 켜 놓으면 차량의 배터리가 방전될 수 있습니다.</p>
              </li>
            </ul>
          </div>
