          <h2 id="id225BDL0M07Q" class=" ">지능형 헤드램프</h2>
          <p class=" ">지능형 헤드램프는 밤에 운전할 때 다른 운전자에게 눈부심 등의 불편함을 주지 않고 상향등을 켤 수 있도록 도와줍니다.</p>
          <p class=" ">앞 유리창에 장착된 전방 카메라에 마주 오는 차량 또는 앞 차량이 감지되면 자동으로 해당 상향등의 LED가 부분적으로 꺼집니다.</p>
          <p class=" ">또한, 고속으로 주행 중에 마주 오는 차량 또는 선행 차량을 감지하면 운전석측 상향등은 꺼지며 동승석측 상향등만으로 지능형 헤드램프가 작동됩니다. </p>
