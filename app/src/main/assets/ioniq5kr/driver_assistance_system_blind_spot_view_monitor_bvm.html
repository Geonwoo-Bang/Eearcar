          <h2 id="a539e637-3f6d-48d2-aa14-66601d9c4152" class=" ">후측방 모니터 (BVM)</h2>
          <p class=" ">후측방 모니터는 운전자가 방향지시등을 켜면 차량에 장착된 광각 카메라를 이용해 해당 방향의 후측방 상황을 영상으로 표시하여 안전하게 차로를 변경할 수 있도록 도와줍니다.</p>
          <div id="note_bxh_w4m_j1c" type="note" class=" note ">
            <p class=" ">BVM은 Blind Spot View Monitor의 약자입니다.</p>
