          <h2 id="id2276A060XY4" class=" ">운전자 주의 경고 (DAW)</h2>
          <p class=" ">주행 중 운전 패턴을 판단하여 운전자의 주의 수준이 일정 수준 이하로 떨어지면 휴식을 권유하여 안전하게 주행할 수 있도록 도와줍니다.</p>
          <div type="note" class=" note ">
            <p class=" ">DAW는 Driver Attention Warning의 약자입니다.</p>
