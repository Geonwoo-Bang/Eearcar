          <h2 id="title_dwm_jgm_c1c" class=" ">주차 거리 경고 (PDW)</h2>
          <p class=" ">주차 거리 경고는 차량이 전진 또는 후진할 때 차량의 전방/측방/후방 초음파센서에서 일정 거리 이내에 있는 사람, 동물 또는 물체를 감지하여 표시등 또는 경고음으로 알려줍니다. </p>
          <div type="note" class=" note ">
            <p class=" ">PDW는 Parking Distance Warning의 약자입니다.</p>
