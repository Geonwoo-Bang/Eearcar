<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>지능형 속도 제한 보조 (ISLA)</title><div id="content-hyundai" class="content">
        <div id="driver_assistance_system_intelligent_speed_limit_assist_isla" lang="ko" class="ditatopic topiclevel-2  ">
          <h2 id="80a316b5-9e88-4583-889e-75bac431bfaf" class=" ">지능형 속도 제한 보조 (ISLA)</h2>
          <p class=" ">도로 표지판을 인식한 정보와 내비게이션의 도로 정보를 활용하여 제한속도 및 부가 표지판 정보를 알려주고, 도로의 제한속도를 준수할 수 있도록 도와줍니다.</p>
          <div type="caution" class=" note ">
            <p class=" ">지능형 속도 제한 보조의 정상적인 작동을 위해 네비게이션을 정기적인 업데이트를 하십시오. 자세한 설정 방법은 인포테인먼트 시스템 웹 매뉴얼을 참고하십시오.</p>
          </div>
          <div id="note_gst_hn4_b1c" type="note" class=" note ">
            <p class=" ">ISLA는 Intelligent Speed Limit Assist의 약자입니다.</p>
          </div>
