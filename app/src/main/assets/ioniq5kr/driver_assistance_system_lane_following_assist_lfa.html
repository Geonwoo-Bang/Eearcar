          <h2 id="title_xx4_tnn_y2c" class=" ">차로 유지 보조 (LFA)</h2>
          <p class=" ">전방 차선 및 차량을 인식하여 차로 중앙을 유지하며 주행하도록 도와줍니다.</p>
          <div type="note" class=" note ">
            <ul class=" ">
              <li class=" ">
                <p class=" ">LFA는 Lane Following Assist의 약자입니다.</p>
              </li>
              <li class=" ">
                <p class=" ">차로 유지 보조의 작동상태를 클러스터 주행 보조 뷰에서도 표시합니다. 클러스터를 주행 보조 모드로 설정하는 방법은 &#x27;<a href="instrument_cluster_vehicle_settings_infotainment_system.html#title_ajp_43p_b1c" class=" Cross-Reference fm:Title ">클러스터 설정하기</a>&#x27;를 참고하십시오.</p>
                <figure id="fig_agm_mf5_j1c" class=" ">
                  <img id="image_bgm_mf5_j1c" src="media/63350651d624830abed70473.png" class=" ">
                  <p class=" ">2C_LFALaneDetectInfo</p>
                </figure>
              </li>
            </ul>
