          <h2 id="id2227B000VE9" class=" ">차로 이탈방지 보조 (LKA)</h2>
          <p class=" ">일정 속도 이상으로 주행 중 전방의 차선 또는 도로 경계를 인식하여 방향지시등을 켜지 않고 차로를 이탈할 때 경고하거나, 차로 이탈이 감지되었을 때 차로를 이탈하지 않도록 조향을 도와줍니다.</p>
          <div type="note" class=" note ">
            <p class=" ">LKA는 Lane Keeping Assist 의 약자입니다.</p>
          </div>
