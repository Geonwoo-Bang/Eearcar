          <h2 id="3bfa7b0e-36c7-47b7-bad2-7ab6a1f942f0" class=" ">내비게이션 기반 스마트 크루즈 컨트롤 (NSCC)</h2>
          <p class=" ">전용도로 주행 시 스마트 크루즈 컨트롤이 내비게이션의 도로 정보를 이용하여 도로 상황에 맞춰 안전한 속도로 주행하도록 도와줍니다.</p>
          <div id="note_s2x_lhl_c1c" type="note" class=" note ">
            <ul id="ul_t2x_lhl_c1c" class=" ">
              <li class=" ">
                <p class=" ">NSCC는 Navigation-based Smart Cruise Control의 약자입니다.</p>
              </li>
              <li class=" ">
                <p class=" ">전용도로는 고속도로/도시 고속도로/자동차 전용도로를 의미합니다.</p>
              </li>
            </ul>
          </div>
