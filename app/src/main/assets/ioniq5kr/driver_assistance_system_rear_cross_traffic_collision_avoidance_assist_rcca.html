<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>후방 교차 충돌방지 보조 (RCCA)</title><div id="content-hyundai" class="content">
        <div id="driver_assistance_system_rear_cross_traffic_collision_avoidance_assist_rcca" lang="ko" class="ditatopic topiclevel-2  ">
          <h2 id="36ef1f66-7e70-4103-bfde-ce5ab94068de" class=" ">후방 교차 충돌방지 보조 (RCCA)</h2>
          <p class=" ">후진 중 후측방에서 다가오는 차량을 인식하여 충돌 위험이 판단되면 경고문과 경고음을 통해 알려주고 충돌하지 않도록 제동을 도와줍니다.</p>
          <figure id="fig_crt_vx5_j1c" class=" ">
            <img id="image_drt_vx5_j1c" src="media/f07b187ade5840c202ba7e7c.png" class=" ">
            <p class=" ">2C_RCCAOpeartionOverview</p>
            <ol id="sl_ert_vx5_j1c" class=" sl ">
              <li class=" ">충돌 경고 영역</li>
              <li class=" ">충돌방지 보조 영역</li>
            </ol>
          </figure>
          <div type="caution" class=" note ">
            <p class=" ">접근하는 차량의 속도에 따라 위험을 경고하는 시점이 다를 수 있습니다.</p>
          </div>
          <div type="note" id="note_q1k_nx5_j1c" class=" note ">
            <p class=" ">RCCA는 Rear Cross-Traffic Collision-Avoidance Assist의 약자입니다.</p>
          </div>
