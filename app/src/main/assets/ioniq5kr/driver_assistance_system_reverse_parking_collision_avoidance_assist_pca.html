          <h2 id="4e3756ee-e5b4-44cc-bc9d-710d3cd6daf4" class=" ">주차 충돌방지 보조 (PCA)</h2>
          <p class=" ">주차 충돌방지 보조는 저속 주행 중 주변 물체 및 보행자가 감지되면 경고 및 제동으로 충돌하지 않도록 도와줍니다.</p>
          <div type="note" class=" note ">
            <ul id="ul_m3g_qjt_m1c" class=" ">
              <li class=" ">
                <p class=" ">PCA는 Reverse Parking Collision-Avoidance Assist의 약자입니다.</p>
              </li>
              <li class=" ">
                <p class=" ">주차 충돌방지 보조가 작동하면 클러스터 화면의 차량 이미지 주변에 테두리 선이 표시됩니다.</p>
                <figure id="fig_b2z_hy3_l1c" class=" ">

                  </figgroup>
                  <p class=" ">2C_PCAOnInfo</p>
                </figure>
              </li>
            </ul>
