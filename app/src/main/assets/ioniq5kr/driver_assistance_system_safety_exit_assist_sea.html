<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>안전 하차 보조 (SEA)</title><div id="content-hyundai" class="content">
        <div id="driver_assistance_system_safety_exit_assist_sea" lang="ko" class="ditatopic topiclevel-2  ">
          <h2 id="title_zsj_tsh_31c" class=" ">안전 하차 보조 (SEA)</h2>
          <figure id="fig_fz4_3j4_b1c" class=" ">
            <img id="image_xgp_jj4_b1c" src="media/42456bbee690ae54dc7e28b6.png" class=" ">
          </figure>
          <p class=" ">안전 하차 보조 시스템은 하차 시 후측방 차량과 충돌하지 않도록 도와줍니다.</p>
          <div id="note_yqs_wbm_j1c" type="note" class=" note ">
            <ul id="ul_hpx_wbm_j1c" class=" ">
              <li class=" ">
                <p class=" ">SEA는 Safety Exit Assist의 약자입니다.</p>
              </li>
              <li class=" ">
                <p class=" ">사이드 미러 경고등이 깜빡이고 경고문과 경고음을 통해 충돌 경고를 알립니다.</p>
                <figure id="fig_exy_5j4_b1c" class=" ">
                  <img id="image_fxy_5j4_b1c" src="media/e980743350031d9ac87072cf.png" class=" ">
                  <p class=" ">2C_SideMirrorWaringLamp</p>
                </figure>
              </li>
            </ul>
          </div>
          <div type="warning" id="note_hk2_ccm_j1c" class=" note ">
            <p class=" ">시동을 껐다가 걸면 안전 하차 경고가 자동으로 설정됩니다. 설정 메뉴에서 선택 해제하여 기능을 끌 수 있으나, 이 경우 안전 하차 경고의 도움을 받을 수 없습니다. 항상 주의하여 운전하십시오.</p>
          </div>
          <div id="driver_assistance_system_safety_exit_assist_sea-subtopics" class="subtopics"></div>
        </div>
