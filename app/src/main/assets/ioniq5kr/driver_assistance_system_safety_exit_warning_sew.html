<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>안전 하차 경고 (SEW)</title><div id="content-hyundai" class="content">
        <div id="driver_assistance_system_safety_exit_warning_sew" lang="ko" class="ditatopic topiclevel-2  ">
          <h2 id="bb1144f1-9a26-4259-9246-c2a1c4d376ba" class=" ">안전 하차 경고 (SEW)</h2>
          <figure id="fig_lpb_tb4_b1c" class=" ">
            <img id="image_mpb_tb4_b1c" src="media/1a29566de14bedd26c660fbe.png" class=" ">
            <p class=" ">2C_SEWOperation</p>
          </figure>
          <p class=" ">안전 하차 경고는 하차 시 후측방의 차량을 인식하여 충돌 위험이 판단되면 경고문과 경고음을 통해 알려줍니다.</p>
          <div id="note_llv_bzl_j1c" type="note" class=" note ">
            <ul id="ul_hnl_gzl_j1c" class=" ">
              <li class=" ">
                <p class=" ">SEW는 Safety Exit Warning의 약자입니다.</p>
              </li>
              <li class=" ">
                <p class=" ">사이드 미러 경고등이 깜빡이고 경고문과 경고음을 통해 충돌 경고를 알립니다.</p>
                <figure id="fig_jnq_czl_j1c" class=" ">
                  <img id="image_yvt_lc4_b1c" src="media/e980743350031d9ac87072cf.png" class=" ">
                  <p class=" ">2C_SideMirrorWaringLamp</p>
                </figure>
              </li>
            </ul>
          </div>
          <div id="note_lb3_c1m_j1c" type="warning" class=" note ">
            <p class=" ">설정 메뉴에서 선택 해제하여 기능을 끌 수 있으나, 이 경우 안전 하차 경고의 도움을 받을 수 없습니다. 항상 주의하여 운전하십시오.</p>
          </div>
          <div id="driver_assistance_system_safety_exit_warning_sew-subtopics" class="subtopics"></div>
        </div>
