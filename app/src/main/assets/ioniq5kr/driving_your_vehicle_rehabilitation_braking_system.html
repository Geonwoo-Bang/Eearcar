          <h2 id="title_y4s_nxt_k1c" class=" ">회생 제동 기능 사용하기</h2>
          <p class=" ">패들 시프트 레버를 조작해 차량의 회생 제동량을 조절할 수 있습니다. </p>
          <p class=" ">주행 중 회생 제동량을 적절히 조절하면 차량의 연비를 개선하고 주행의 재미를 더할 수 있습니다.</p>
          <div type="note" class=" note ">
            <p class=" ">&#x27;회생 제동&#x27;이란 구동용 전기 모터가 감속할 때의 운동 에너지를 전기 에너지로 변환해 고전압 배터리를 충전하는 기술입니다.</p>
