          <h2 id="id225NE0PI0S2" class=" ">전기차 충전하기</h2>
          <p class=" ">전기차의 충전과 관련된 상세 정보를 확인하고 차량을 충전하십시오.</p>
          <p class=" ">공공 충전소에서 완속 또는 급속 충전 케이블을 사용해 차량을 충전할 수 있습니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">비상시 공공 충전소까지 차량을 이동할 수 없는 경우에는 휴대용 충전기를 사용해 일반 전원(AC 220 V)으로도 차량을 충전할 수 있습니다. </p>
            </li>
            <li class=" ">
              <p class=" ">주변의 충전소 위치를 검색하려면 &#x27;<a href="id225JFA0005H.html#id225KCI00PE9" class=" Cross-Reference fm:Title ">충전소 검색 기능 사용하기</a>&#x27;를 참고하십시오.</p>
            </li>
          </ul>
