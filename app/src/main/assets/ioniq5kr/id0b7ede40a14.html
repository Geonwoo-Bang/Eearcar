<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>스마트 크루즈 컨트롤 (SCC)</title><div id="content-hyundai" class="content">

          <h2 id="id2227B0ME0QN" class=" ">스마트 크루즈 컨트롤 (SCC)</h2>
          <p class=" ">스마트 크루즈 컨트롤은 전방의 차량을 인식하여 거리를 유지하고, 운전자가 설정한 속도로 주행하도록 도와줍니다.</p>
          <div type="note" id="note_apt_ffg_rvb" class=" note ">
            <ul id="ul_ttg_m2v_31c" class=" ">
              <li class=" ">
                <p class=" ">SCC는 Smart Cruise Control의 약자입니다.</p>
              </li>
              <li class=" ">
                <p class=" ">스마트 크루즈 컨트롤의 작동상태를 클러스터 주행 보조 뷰에서도 표시합니다. 클러스터를 주행 보조 모드로 설정하는 방법은 &#x27;<a href="instrument_cluster_vehicle_settings_infotainment_system.html#title_ajp_43p_b1c" class=" Cross-Reference fm:Title ">클러스터 설정하기</a>&#x27;를 참고하십시오.</p>
                <figure id="fig_fsq_v2v_31c" class=" ">
                  <img id="image_uht_gfv_31c" src="media/c3074bc4d129a512ed708a30.png" class=" ">
                </figure>
              </li>
              <li class=" ">
                <p class=" ">클러스터 사양 또는 테마에 따라 클러스터에 표시되는 이미지나 색상이 다를 수 있습니다.</p>
              </li>
            </ul>
          </div>

        </div>
