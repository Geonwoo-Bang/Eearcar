<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>기능 켜기 및 끄기</title><div id="content-hyundai" class="content">
        <div id="id0c4d281a23ba" lang="ko" class="ditatopic topiclevel-3  ">
          <h3 id="17d0fe1b-f98c-4d28-a51e-1335c4abb8f3" class=" ">기능 켜기 및 끄기</h3>
          <p class=" ">시동 &#x27;ON&#x27; 상태에서 스티어링 휠에 있는 차로 안전 (<userinput class=" ">p</userinput>) 버튼을 길게 눌러 차로 이탈방지 보조를 켜고 끌 수 있습니다.</p>
          <figure id="fig_f5n_41h_rzb" class=" ">
            <img id="image_g5n_41h_rzb" src="media/c28f840fb2cbaa5407d4d860.png" class=" ">
            <p class=" ">2C_LaneSafetyButton</p>
          </figure>
          <p class=" ">차로 이탈방지 보조가 준비 상태가 되면 클러스터에 회색 <userinput class=" ">S</userinput> 표시등이 켜지고, 작동할 수 있는 상태가 되면 초록색 <userinput class=" ">S</userinput> 표시등으로 켜집니다.</p>
          <div id="note_htr_hkp_b1c" type="note" class=" note ">
            <p class=" ">차로 이탈방지 보조가 꺼져 있거나, 센서 가림 또는 고장이 발생하면 클러스터에 주황색 <userinput class=" ">S</userinput> 표시등이 켜집니다.</p>
            <p class=" ">차량을 점검해도 계속 켜져 있으면 가까운 당사 직영 하이테크센터나 블루핸즈에서 점검과 정비를 받으십시오.</p>
          </div>
        </div>
      </div><p><a href="https://ownersmanual.hyundai.com/full_webhelp/NE1/2026/ko_KR/id0c4d281a23ba.html">현대자동차 공식 원문 열기</a></p>
