          <h3 id="c925a14b-7903-414d-bb5e-41173c5623a7" class=" ">스마트 열선/통풍(운전석 공조 연동 자동 제어) 설정하기</h3>
          <p class=" ">인포테인먼트 시스템에서 <span class=" uicontrol ">설정</span> &gt; <span class=" uicontrol ">차량</span> &gt; <span class=" uicontrol ">공조</span> &gt; <span class=" uicontrol ">공조 연동 자동 제어</span>를 선택한 후 <span class=" uicontrol ">핸들 열선</span>, <span class=" uicontrol ">운전석 시트 열선/통풍</span> 항목을 켜거나 끄십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">외부 기온과 차량 내부 온도에 따라 운전석 열선, 통풍 시트, 스티어링 휠 열선 기능의 작동 및 세기를 자동으로 제어합니다.</p>
            </li>
            <li class=" ">
              <p class=" ">자세한 설명은 &#x27;<a href="safety_system_hot_wire_ventilation_seat.html#title_pww_bq4_k1c" class=" Cross-Reference fm:Title ">열선 시트 및 통풍 시트 사용하기</a>&#x27; 및 &#x27;<a href="id23C5G0G0JE6.html#title_h2r_dq4_k1c" class=" Cross-Reference fm:Title ">스티어링 휠 열선 사용하기</a>&#x27;을 참고하십시오.</p>
            </li>
          </ul>
        </div>
