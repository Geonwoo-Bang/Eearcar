<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>안전 하차 보조 설정</title><div id="content-hyundai" class="content">
        <div id="id1fd552231b4" lang="ko" class="ditatopic topiclevel-3  ">
          <h3 id="9685a86a-814c-4af2-94ee-514739e23ef9" class=" ">안전 하차 보조 설정</h3>
          <section id="section_rbk_hl4_b1c" class=" ">
            <div class=" title ">하차 안전</div>
            <figure id="fig_xxx_hl4_b1c" class=" ">
              
              <img id="image_yxx_hl4_b1c" src="media/dd5b6d0fb9da66551f12cd8d.png" class=" ">
              
              <p class=" ">2C_ExitSafetySettings</p>
            </figure>
            <p class=" ">시동 &#x27;ON&#x27; 상태에서 인포테인먼트 시스템의 <span class=" uicontrol ">설정</span> &gt; <span class=" uicontrol ">운전자 보조</span> &gt; <span class=" uicontrol ">주행 안전</span> &gt; <span class=" uicontrol ">하차 안전</span>을 차례로 선택하십시오. 안전 하차 보조가 켜집니다.</p>
            <div type="note" id="note_jmj_tcm_j1c" class=" note ">
              <ul id="ul_qnq_rcm_j1c" class=" ">
                <li class=" ">
                  <p class=" ">안전 하차 보조는 시동이 꺼진 후에도 약 3분 동안 작동합니다. 도어를 잠그면 안전 하차 보조는 바로 해제됩니다.</p>
                </li>
              </ul>
              <p class=" ">안전 하차 보조는 다음의 경고 방식을 설정할 수 있습니다. </p>
              <ul id="ul_ox2_jln_y2c" class=" ">
                <li class=" ">
                  <p class=" ">경고 음량</p>
                </li>
                <li class=" ">
                  <p class=" ">주행 안전 우선</p>
                </li>
              </ul>
              <p class=" ">자세한 내용은 7장 &#x27;<a href="id_hl1_tn3_g1c.html#title_ypd_dhj_g1c" class=" Cross-Reference fm:Title ">운전자 보조 기능 설정</a>&#x27;을 참고하십시오.</p>
            </div>
          </section>
        </div>
