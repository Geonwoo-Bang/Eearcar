<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>안전 하차 경고 설정</title><div id="content-hyundai" class="content">

          <h3 id="7d61e938-8e71-4d77-8aa9-11fb5b3f001b" class=" ">안전 하차 경고 설정</h3>
          <section id="section_im2_524_b1c" class=" ">
            <div class=" title ">하차 안전</div>
            <figure id="fig_s21_v24_b1c" class=" ">
              <img id="image_t21_v24_b1c" src="media/dd5b6d0fb9da66551f12cd8d.png" class=" ">
              <p class=" ">2C_ExitSafetySettings</p>
            </figure>
            <p class=" ">시동 &#x27;ON&#x27; 상태에서 인포테인먼트 시스템의 <span class=" uicontrol ">설정</span> → <span class=" uicontrol ">운전자 보조</span> → <span class=" uicontrol ">주행 안전</span> → <span class=" uicontrol ">하차 안전</span> 을 차례로 선택하십시오. 안전 하차 경고가 켜집니다.</p>
            <div type="note" id="note_zdn_k1m_j1c" class=" note ">
              <p class=" ">안전 하차 경고는 다음의 경고 방식을 설정할 수 있습니다. </p>
              <ul id="ul_g4p_bkn_y2c" class=" ">
                <li class=" ">
                  <p class=" ">경고 음량</p>
                </li>
                <li class=" ">
                  <p class=" ">주행 안전 우선</p>
                </li>
              </ul>
              <p class=" ">자세한 내용은 7장 &#x27;<a href="id_hl1_tn3_g1c.html#title_ypd_dhj_g1c" class=" Cross-Reference fm:Title ">운전자 보조 기능 설정</a>&#x27;을 참고하십시오.</p>
            </div>
          </section>
