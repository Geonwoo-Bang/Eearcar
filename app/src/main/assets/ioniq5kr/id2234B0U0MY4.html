<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>급제동 브레이크 보조 시스템(BAS)</title><div id="content-hyundai" class="content">
        <div id="id2234B0U0MY4" class="ditatopic topiclevel-3  ">
          <h3 id="369bcb4a-b60f-458d-af29-4dbe086a2f9a" class=" ">급제동 브레이크 보조 시스템(BAS)</h3>
          <p class=" ">급제동 브레이크 보조 시스템(Brake Assistant System, BAS)은 운전자가 브레이크 페달을 순간적으로 강하게 밟아 차량을 긴급하게 제동할 때 추가적인 압력을 제공해 신속한 제동을 돕습니다.</p>
          <div type="note" id="note_bvl_dkp_jvb" class=" note ">
            <p class=" ">급제동 브레이크 보조 시스템은 ABS 기능이 작동하는 시점까지 추가적인 압력을 제공해 ABS 제어 시간과 제동거리를 단축합니다.</p>
          </div>
          <div id="note_vfw_vv4_k1c" type="caution" class=" note ">
            <p class=" ">운전자의 주행 습관 및 차량 속도, 브레이크 페달에 가해지는 압력, 노면 상태에 따라 기능이 작동하지 않을 수 있습니다.</p>
          </div>
        </div>
