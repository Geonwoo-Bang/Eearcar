          <h3 id="2597a68f-f253-479d-9801-f321dea2f597" class=" ">스티어링 휠 진동 경고</h3>
          <p class=" ">스티어링 휠 진동 경고가 적용된 운전자 보조 시스템의 기능은 위험 상황을 감지하면 스티어링 휠을 진동하여 운전자에게 경고합니다.</p>
          <section id="section_cwj_vk3_swb" class=" ">
            <div class=" title ">기능 설정하기 </div>
            <p class=" ">시동 &#x27;ON&#x27; 상태일 때 인포테인먼트 시스템의 <span class=" uicontrol ">설정</span> &gt; <span class=" uicontrol ">차량</span> &gt; <span class=" uicontrol ">운전자 보조</span> &gt; <span class=" uicontrol ">경고 방식</span> &gt; <span class=" uicontrol ">핸들 진동 경고</span>를 차례로 선택하십시오.</p>
            <p class=" ">자세한 내용은 7장 내 &#x27;<a href="adas.html#title_amh_g4m_m1c" class=" Cross-Reference fm:Title ">운전자 보조 기능</a>&#x27;의 각 기능 설명을 참고하십시오.</p>
