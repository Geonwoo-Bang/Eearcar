          <h3 id="33a7f5dc-c502-49be-9875-f979497967fe" class=" ">전기차가 침수된 경우</h3>
          <p class=" ">전기차 주행 중 차량이 침수된 경우 다음과 같이 조치하십시오.</p>
          <ul id="ul_wtf_jqk_4wb" class=" ">
            <li class=" ">
              <p class=" ">즉시 시동을 끈 후 키를 휴대하고 안전한 장소로 대피하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">긴급출동 지원센터에 연락해 전기 자동차 침수가 발생했음을 알리십시오.</p>
            </li>
          </ul>
          <div type="warning" id="note_rcn_sqk_4wb" class=" note ">
            <p class=" ">침수된 전기차에 접근하거나 신체를 접촉하지 마십시오. 고전압 배터리의 누전이나 단락으로 인해 감전, 화재 등의 사고가 발생할 수 있습니다.</p>
          </div>
        </div>
