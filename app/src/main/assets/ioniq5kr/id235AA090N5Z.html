          <h2 id="title_ssz_rx4_zvb" class=" ">HTRAC (4륜구동 장치)</h2>
          <p class=" ">4WD는 전후륜이 모두 구동되어 일반 도로에서는 적절하게 전륜 및 후륜 구동력을 배분하며, 비포장 상태의 험한 길을 탈출하거나 급경사로, 모랫길, 진흙길 등을 주행할 때 차량의 구동력을 극대화하여 주행성을 향상시켜줍니다.</p>
          <div type="note" class=" note ">
            <p class=" ">4WD는 Four Wheel Drive의 약자입니다.</p>
