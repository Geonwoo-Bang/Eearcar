<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>코트 후크</title><div id="content-hyundai" class="content">
        <div id="id235IB0702HS" class="ditatopic topiclevel-3  ">
          <h3 id="4ae91201-2b4e-4a30-a186-9f0c53f28917" class=" ">코트 후크</h3>
          <figure id="id235IB0860UI" class=" ">
            <img id="id235IB08A0YK" src="media/ea6ce455eee282db5fdebe0b.png" class=" ">
            <p class=" ">2C_CoatHook</p>
          </figure>
          <p class=" ">뒷좌석 유리창 위 손잡이에 설치된 코트 후크에 옷을 걸어 보관할 수 있습니다.</p>
          <div type="caution" id="note_wd5_cyv_sxb" class=" note ">
            <p class=" ">코트 후크에 무거운 옷을 걸지 마십시오. 후크가 손상될 수 있습니다.</p>
          </div>
          <div type="warning" id="note_xd5_cyv_sxb" class=" note ">
            <figure class=" ">
              <img src="media/6abec919898b97152d54d8c4.png" class=" ">
              <p class=" ">2C_CoatHookWarning</p>
            </figure>
            <p class=" ">코트 후크에 옷 이외의 다른 물건을 걸어 두지 마십시오. 옷걸이 등 단단하고 날카로운 물건이나 깨지기 쉬운 물건을 걸어 두는 경우, 충돌이 발생하거나 커튼 에어백이 작동할 때 차량 손상, 심각한 부상 및 인명피해가 발생할 수 있습니다.</p>
          </div>
        </div>
      </div><p><a href="https://ownersmanual.hyundai.com/full_webhelp/NE1/2026/ko_KR/id235IB0702HS.html">현대자동차 공식 원문 열기</a></p>
