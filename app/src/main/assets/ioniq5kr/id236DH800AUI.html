          <h3 id="title_o3r_scm_m1c" class=" ">클러스터 사이드 마그네틱 패널</h3>
          <figure id="fig_jdw_lwn_k1c" class=" ">
            <img id="image_kdw_lwn_k1c" src="media/fc729c8ee0ecd28db37c4755.png" class=" ">
            <p class=" ">2C_ClusterSidePannel</p>
          </figure>
          <p class=" ">클러스터 사이드 마그네틱 패널은 자석을 활용하여 통행권, 주차권, 영수증 등을 부착할 수 있는 패드입니다.</p>
          <div type="caution" id="note_ldw_lwn_k1c" class=" note ">
            <p class=" ">스마트폰 등 무겁거나 파손의 우려가 있는 물건은 부착하지 마십시오. 주행 중 물건이 떨어지면 파손될 수 있습니다.</p>
          </div>
          <div type="warning" id="note_mdw_lwn_k1c" class=" note ">
            <p class=" ">안전을 위해 클러스터 사이드 마그네틱 패널에 스마트폰 등 무겁거나 날카로운 물건을 부착하지 마십시오. 주행 중 물건이 떨어지면 운전자가 부상을 입거나, 주의가 분산되어 사고가 발생할 위험이 높아집니다.</p>
          </div>
        </div>
