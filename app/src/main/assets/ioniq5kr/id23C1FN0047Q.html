<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>충전 즉시 중단하기</title><div id="content-hyundai" class="content">

          <h3 id="1bf48f29-8df6-4f9a-88ab-f2c19aba07af" class=" ">충전 즉시 중단하기</h3>
          <p class=" ">완속 충전기, 급속 충전기, 또는 휴대용 충전기로 차량을 충전하는 도중에 충전을 중단하려면 다음 절차를 따르십시오.</p>
          <ol class=" ">
            <li class=" ">
              <p class=" ">차량 도어의 잠금 또는 잠금 해제 버튼을 누르십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">버튼을 누른 후 15초 이내에 충전 도어를 열고 즉시 충전 (<userinput class=" ">Ǉ</userinput>) 버튼을 2초 이상 누르십시오.</p>
            </li>
          </ol>
        </div>
