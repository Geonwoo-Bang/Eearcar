          <h3 id="0c783aaa-39a7-4914-826b-0f41ed9c69d3" class=" ">스마트 회생 제동 끄기</h3>
          <p class=" ">스마트 회생 제동 기능 사용 중 회생 제동 증가 레버(<userinput class=" ">°</userinput>)를 0.5초 이상 당기면 기능이 꺼집니다(&#x27;<a href="id9beba88eac3.html#title_vzw_rkn_m1c" class=" Cross-Reference fm:Title ">원 페달 드라이빙 사용하기</a>&#x27; 참고).</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">클러스터의 회생 제동 단계 표시등에 현재 회생 제동 단계가 표시됩니다.</p>
            </li>
          </ul>
          <div id="note_iy2_yzs_41c" type="note" class=" note ">
            <p class=" ">스마트 회생 제동 사용 중에는 아이 페달 기능을 사용할 수 없습니다. 아이 페달 기능을 사용하려면 먼저 스마트 회생 제동 기능을 끄십시오.</p>
          </div>
        </div>
