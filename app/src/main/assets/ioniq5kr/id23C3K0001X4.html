          <h3 id="74ec4b94-441b-40c0-923a-4a11a5bbf4b6" class=" ">타이어 공기압 수시 점검</h3>
          <p class=" ">적합한 규격의 타이어를 사용하고, 타이어의 접지 상태를 수시로 확인하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">고속 주행 중 공기압 부족으로 타이어에 물결 모양의 주름이 발생하는 경우 타이어가 파열되어 차량 전복 등의 사고가 발생할 수 있습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">적정 타이어 공기압을 유지하고, 장거리 주행이나 고속 주행 전 타이어 공기압을 점검하십시오.</p>
            </li>
          </ul>
