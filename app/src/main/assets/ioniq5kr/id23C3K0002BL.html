          <h3 id="929983d6-ce48-4b79-bead-41a03d330624" class=" ">차량 외부로 손, 얼굴 노출 금지</h3>
          <p class=" ">창문 밖으로 손이나 얼굴 등을 내밀지 마십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">주행 중 얼굴이나 신체 일부가 차량 밖의 주변 물체에 충돌하는 경우 심각한 부상 또는 인명피해가 발생할 수 있습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">특히 어린이가 동승한 경우, 예기치 못한 차량 외부 신체 노출에 항상 주의하십시오.</p>
            </li>
          </ul>
