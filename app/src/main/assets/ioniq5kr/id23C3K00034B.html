          <h3 id="85f0e9cf-1db6-4b4b-ae51-d45dfd7171f0" class=" ">주행 중 시동 정지 금지</h3>
          <p class=" ">주행 중에는 시동을 끄지 마십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">주행 중 시동을 끄면 브레이크의 성능이 저하될 수 있습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">주행 중 시동을 끄면 파워 스티어링 장치가 작동하지 않아 스티어링 휠이 무겁게 느껴지고 차량의 조향이 어려워질 수 있습니다.</p>
            </li>
          </ul>
