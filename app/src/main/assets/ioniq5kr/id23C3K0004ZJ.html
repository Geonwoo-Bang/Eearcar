<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>클러스터 점검</title><div id="content-hyundai" class="content">

          <h3 id="bf6df194-bd3b-40a6-ab47-86e82f802ecd" class=" ">클러스터 점검</h3>
          <p class=" ">매 주행 전 클러스터에 표시된 각종 정보를 확인하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">클러스터의 모든 게이지가 정상적으로 작동하며, 경고등이나 경고 메시지가 표시되지 않는지 확인하십시오(<a href="instrument_cluster_instrument_cluster.html#id2227B0U0UBI" class=" Cross-Reference fm:Title ">클러스터에 표시되는 정보</a> 참고).</p>
            </li>
            <li class=" ">
              <p class=" ">주차 브레이크를 해제할 때 브레이크 경고등이 꺼지는지 확인하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">고전압 배터리 충전량이 충분한지 확인하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">고전압 배터리 충전량이 충분한지 확인하십시오(<a href="id23C4H08E0ZJ.html#id23C4H08E0ZJ" class=" Cross-Reference fm:Title ">주행 가능 거리</a> 참고).</p>
            </li>
          </ul>
        </div>
