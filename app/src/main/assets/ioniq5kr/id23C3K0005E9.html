          <h3 id="cd7f7efd-14bb-4ee3-b510-708c88a0aaa1" class=" ">교차로, 건널목 긴급 상황 발생 시</h3>
          <p class=" ">교차로나 건널목을 횡단하는 중 시동이 꺼진 경우 주위 사람들에게 도움을 요청하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">최대한 빨리 차량을 안전한 장소로 이동하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">차량을 이동할 수 없고 상황이 위급하다 판단되는 경우, 안전한 장소로 신속하게 대피한 후 경찰서 또는 소방서에 현재 상황을 신고하십시오.</p>
            </li>
          </ul>
