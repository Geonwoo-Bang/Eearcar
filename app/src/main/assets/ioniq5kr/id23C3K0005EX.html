          <h3 id="c8c553ab-12ae-40f8-82ad-4fc65720a3e8" class=" ">임의 배선 사용 금지</h3>
          <p class=" ">차량에 인포테인먼트 시스템, 도난경보 장치, 원격 시동 장치, 카폰, 무전기, 블랙박스, 하이패스 단말기 등 장치를 설치할 때 임의의 배선을 추가하지 마십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">차량의 성능이 저하되거나 차량 부품이 손상될 수 있습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">화재나 실내 잡음, 또는 이상 소음이 발생할 수 있습니다.</p>
            </li>
          </ul>
