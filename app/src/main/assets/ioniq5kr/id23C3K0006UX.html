          <h3 id="099fe37e-e435-46d8-a9bc-cf8ea7a6cb39" class=" ">시트 커버류 설치 시 주의사항</h3>
          <p class=" ">시트 커버를 설치하기 전에 시트의 배선 및 통풍구 위치를 주의 깊게 확인하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">시트 커버가 통풍구를 가리거나 배선에 단락 또는 단선이 발생하는 경우, 잡음, 히터 및 통풍 기능 불량 또는 화재가 발생할 수 있으므로 주의하십시오.</p>
            </li>
          </ul>
          <div type="warning" class=" note ">
            <p class=" ">사이드 에어백이 장착된 차량의 시트 커버를 교체하거나 비닐 커버 등을 추가로 장착하지 마십시오. 충돌 사고 발생 시 에어백 작동을 방해해 심각한 부상이 발생할 수 있습니다.</p>
          </div>
        </div>
