<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>자가 정비 시 주의사항</title><div id="content-hyundai" class="content">
        <div id="id23C3K00070A" class="ditatopic topiclevel-3  ">
          <h3 id="0c072c08-740f-452a-817c-97cd3661c238" class=" ">자가 정비 시 주의사항</h3>
          <p class=" ">차량을 직접 점검하거나 정비할 때 다음 지시를 따르십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">차량을 점검하기 전에 변속기 위치가 &#x27;P&#x27;(주차)이며, 주차 브레이크가 체결되어 있는지 확인하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">안전이 확보된 평지에서만 리프트를 사용하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">지정된 잭업(jack-up) 위치에만 리프트를 설치하십시오. 잭업 위치 이외의 위치에 리프트를 설치하는 경우 차량 하부가 손상될 수 있습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">차량을 들어 올리기 전, 바닥에 닿아 있는 바퀴에 고임목을 설치하십시오.</p>
            </li>
          </ul>
        </div>
      </div><p><a href="https://ownersmanual.hyundai.com/full_webhelp/NE1/2026/ko_KR/id23C3K00070A.html">현대자동차 공식 원문 열기</a></p>
