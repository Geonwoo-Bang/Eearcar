<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>좌석, 스티어링 휠, 미러 조정</title><div id="content-hyundai" class="content">

          <h3 id="01471ef7-f18a-4601-ab2a-678685aa9f46" class=" ">좌석, 스티어링 휠, 미러 조정</h3>
          <p class=" ">시트, 스티어링 휠, 미러 등을 안전한 운전에 적합한 위치로 조절하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">좌석에 깊숙이 앉아 브레이크 페달을 끝까지 밟았을 때 무릎이 약간 굽혀지고, 손목이 스티어링 휠의 가장 윗부분에 닿도록 시트와 스티어링 휠 위치를 조절하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">헤드레스트를 조절할 수 있는 차량의 경우, 운전자의 귀 윗부분이 헤드레스트 중심에 위치하도록 헤드레스트 높이를 조절하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">차량 내부와 외부의 미러를 조절해 충분한 시야를 확보하십시오.</p>
            </li>
          </ul>
        </div>
