<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>CHARGE/POWER 게이지</title><div id="content-hyundai" class="content">
        <div id="id23C4H08C0BI" class="ditatopic topiclevel-3  ">
          <h3 id="1700683a-ed91-4606-bd65-119172a312b4" class=" ">CHARGE/POWER 게이지</h3>
          <figure class=" ">
            <div class=" title ">A타입/B타입</div>
            <figgroup class=" ">
              <img src="media/a26a3513ce86555795d9d3f5.png" class=" ">
            </figgroup>
            <p class=" ">2C_PowerChargeGauge</p>
          </figure>
          <p class=" ">회생 제동으로 생산되는 전기 에너지의 충전량(CHARGE)과 모터가 소비하는 전력량(POWER)의 상태를 표시합니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">
                <span class=" uicontrol ">CHARGE</span>: 차량을 감속하거나 내리막길을 주행할 때 회생 제동을 통한 배터리의 충전 상태를 표시합니다. 충전량이 많을수록 표시기가 왼쪽으로 이동합니다.</p>
            </li>
            <li class=" ">
              <p class=" ">
                <span class=" uicontrol ">POWER</span>: 차량을 가속하거나 오르막길을 주행할 때 모터가 소비하는 전력을 표시합니다. 소비 전력이 높을수록 표시기가 오른쪽으로 이동합니다.</p>
            </li>
          </ul>
        </div>
      </div><p><a href="https://ownersmanual.hyundai.com/full_webhelp/NE1/2026/ko_KR/id23C4H08C0BI.html">현대자동차 공식 원문 열기</a></p>
