          <p class=" ">현재 배터리에 충전된 에너지로 주행할 수 있는 거리를 표시합니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">자세한 설명은 &#x27;<a href="id225KB0H00YK.html#title_f5f_55t_f5b" class=" Cross-Reference fm:Title ">전기차 주행 정보 확인하기</a>&#x27;를 참고하십시오.</p>
            </li>
          </ul>
          <div type="note" class=" note ">
            <p class=" ">주행 가능 거리는 운전 방식, 전기 사용량, 사용 환경, 고전압 배터리 충전량 등 다양한 주행 조건에 따라 결정되므로, 공인 인증 수치보다 높아지거나 낮아질 수 있습니다.</p>
