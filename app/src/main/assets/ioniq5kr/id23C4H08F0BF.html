<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>외기 온도</title><div id="content-hyundai" class="content">
        <div id="id23C4H08F0BF" class="ditatopic topiclevel-3  ">
          <h3 id="06d712bc-80d2-4115-b066-2f0113644e71" class=" ">외기 온도</h3>
          <figure class=" ">
            <img src="media/4ef6a55f558156bce068be17.png" class=" ">
            <p class=" ">2C_OutsideTemp</p>
          </figure>
          <p class=" ">차량 외부의 온도를 표시합니다.</p>
          <div type="note" class=" note ">
            <ul class=" ">
              <li class=" ">
                <p class=" ">차량에 설치된 외기 온도 표시 장치는 일반 온도계와 달리 온도 변화를 즉시 반영해 표시하지 않습니다.</p>
              </li>
              <li class=" ">
                <p class=" ">온도 단위를 변경하려면 인포테인먼트 시스템에서 <span class=" uicontrol ">설정</span> &gt; <span class=" uicontrol ">일반</span> &gt; <span class=" uicontrol ">단위설정</span> &gt; <span class=" uicontrol ">온도 단위</span>를 선택하십시오.</p>
              </li>
              <li class=" ">
                <p class=" ">외기 온도 표시 단위를 변경하면 히터 및 에어컨의 온도 단위도 동시에 변경됩니다.</p>
              </li>
              <li class=" ">
                <p class=" ">업데이트로 인해 인포테인먼트 시스템의 상세 설정이 변경될 수 있습니다. 자세한 설정 방법은 인포테인먼트 시스템 웹 매뉴얼을 참고하십시오.</p>
              </li>
            </ul>
          </div>
        </div>
