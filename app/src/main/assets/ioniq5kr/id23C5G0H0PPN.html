          <h3 id="0e2826c7-3725-4efb-87be-cd40a6ca84e3" class=" ">감속기 오일 점검하기</h3>
          <p class=" ">당사 직영 하이테크센터나 블루핸즈에서 감속기 오일 레벨을 주기적으로 점검하고 필요 시 보충 또는 교환하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">일반 주행 시: 매 60,000 km마다 점검</p>
            </li>
            <li class=" ">
              <p class=" ">가혹 조건 주행 시: 매 120,000 km마다 교환</p>
            </li>
          </ul>
          <div type="note" class=" note ">
            <p class=" ">감속기 오일은 레벨 게이지가 없으므로 운전자가 직접 확인하거나 보충할 수 없습니다.</p>
          </div>
