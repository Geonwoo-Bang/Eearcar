          <h3 id="title_nsk_rnl_m1c" class=" ">후드 열기</h3>
          <ol class=" ">
            <li class=" ">
              <p class=" ">운전석 아래의 후드 열림 레버를 당기십시오.</p>
              <ul class=" ">
                <li class=" ">
                  <p class=" ">후드가 조금 열립니다.</p>
                </li>
              </ul>
              <figure class=" ">
                <img src="media/44eda172aaa3805062b881fd.png" class=" ">
                <p class=" ">2C_HoodOpenLever</p>
              </figure>
            </li>
            <li class=" ">
              <p class=" ">차량 앞에서 후드를 약간 들어 올린 후, 후드 안쪽의 2차 열림 레버(1)를 왼쪽으로 민 상태로 후드(2)를 들어 올리십시오.</p>
              <ul class=" ">
                <li class=" ">
                  <p class=" ">후드를 중간 정도 들어 올리면 자동으로 열립니다.</p>
                </li>
              </ul>
              <figure class=" ">
                <img src="media/93a0c520a799336221514f86.png" class=" ">
                <p class=" ">2C_HoodOpen</p>
              </figure>
            </li>
          </ol>
