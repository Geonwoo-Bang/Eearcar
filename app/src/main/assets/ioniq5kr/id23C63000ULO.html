<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>녹화 작동 조건</title><div id="content-hyundai" class="content">
        <div id="id23C63000ULO" class="ditatopic topiclevel-3  ">
          <h3 id="04f9e91a-24bc-499d-9b8d-420eb5b4cd20" class=" ">녹화 작동 조건</h3>
          <p class=" ">녹화 기능이 작동하는 조건은 다음과 같습니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">
                <span class=" uicontrol ">주행 중 상시</span> 또는 <span class=" uicontrol ">이벤트 녹화</span> 기능을 설정하고 차량을 주행하거나 시동 &#x27;ACC&#x27; 또는 &#x27;ON&#x27; 상태인 경우</p>
            </li>
            <li class=" ">
              <p class=" ">
                <span class=" uicontrol ">주차 중 상시 녹화</span> 또는 <span class=" uicontrol ">이벤트 녹화</span> 기능을 설정한 후 차량의 시동을 끈 경우</p>
            </li>
            <li class=" ">
              <p class=" ">64 GB 이상의 SD 메모리를 정상적으로 삽입했으며, 사용 가능한 메모리 용량이 32 GB 이상 남아 있는 경우</p>
            </li>
          </ul>
          <div type="note" class=" note ">
            <p class=" ">주행 및 주차 시의 상시 녹화 또는 이벤트 녹화 설정에 대한 자세한 설명은 &#x27;<a href="id23C620P006X.html#section_hlq_4zm_m1c" class=" Cross-Reference fm:Title ">녹화 설정하기</a>&#x27;를 참고하십시오.</p>
          </div>
        </div>
      </div><p><a href="https://ownersmanual.hyundai.com/full_webhelp/NE1/2026/ko_KR/id23C63000ULO.html">현대자동차 공식 원문 열기</a></p>
