<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>배터리 방전 방지 기능(조명 자동 꺼짐)</title><div id="content-hyundai" class="content">
        <div id="id23C697005UI" class="ditatopic topiclevel-3  ">
          <h3 id="603fd544-9105-4826-a42e-d8b4d72f0b49" class=" ">배터리 방전 방지 기능(조명 자동 꺼짐)</h3>
          <p class=" ">미등이 켜진 상태로 차량의 시동을 끄고 운전석 도어를 열면 미등이 자동으로 꺼져 배터리 방전을 방지합니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">시동을 끈 이후에 전조등이나 미등을 켜는 경우 운전석 도어를 열더라도 미등이 꺼지지 않습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">야간에 시동을 끄고 정차 중 미등을 켜 두려면 조명 스위치를 OFF 위치로 움직인 후 미등을 다시 켜십시오.</p>
            </li>
          </ul>
          <div type="caution" class=" note ">
            <p class=" ">배터리 방전을 방지하려면 차량을 떠나기 전에 모든 조명이 꺼진 것을 확인하십시오.</p>
          </div>
        </div>
