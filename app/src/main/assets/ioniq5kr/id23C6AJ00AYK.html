          <h3 id="730603c6-4372-44cf-8354-684de7d69263" class=" ">실내등 자동 소등 기능</h3>
          <p class=" ">실내등이 켜진 상태로 시동을 끄고 도어와 테일게이트를 모두 닫으면 20분 후 실내등이 자동으로 꺼집니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">도어 또는 테일게이트가 열려 있는 경우, 최대 25분 후에 실내등이 자동으로 꺼집니다.</p>
            </li>
            <li class=" ">
              <p class=" ">도난경보 장치가 장착된 차량의 경우, 스마트 키로 도어를 잠가 차량이 경계 상태로 진입한 후 5초가 지나면 실내등이 자동으로 꺼집니다.</p>
            </li>
          </ul>
