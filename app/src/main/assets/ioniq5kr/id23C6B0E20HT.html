          <h3 id="a1dd890d-e02b-4a98-9864-d15f2dfa8222" class=" ">손상된 표면 정비</h3>
          <p class=" ">차체 표면에 깊게 파인 자국이나 돌멩이 자국이 발생하는 경우 신속히 수리하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">금속 표면이 노출되면 녹과 부식이 발생해 차량 표면을 심각하게 훼손할 수 있습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">표면 손상으로 인해 금속 표면의 보수나 부품 교체가 필요한 경우, 당사 직영 하이테크센터나 블루핸즈에서 차량을 정비하십시오.</p>
            </li>
          </ul>
        </div>
