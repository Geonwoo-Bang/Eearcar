          <h3 id="3c2a2b27-c319-4a88-b7b8-7dc6c25635a0" class=" ">광택 재질 부품 관리</h3>
          <ul class=" ">
            <li class=" ">
              <p class=" ">차체에 부착된 타르나 곤충 자국을 제거할 때 타르 제거기를 사용하고, 뾰족하거나 날카로운 물건을 사용하지 마십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">왁스나 크롬 부식 방지제를 바르고 광택이 날 때까지 문지르십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">제설제가 사용되는 지역이나 염분이 많은 해변 지역에서는 광택 소재 위에 두터운 왁스 코팅을 유지하거나 부식 방지 처리를 하십시오. 필요한 경우, 부식 방지용 석유 젤리(바셀린)나 기타 보호용 컴파운드를 바르십시오.</p>
            </li>
          </ul>
        </div>
