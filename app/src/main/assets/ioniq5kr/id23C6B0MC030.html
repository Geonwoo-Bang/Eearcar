          <h3 id="d24225f8-964a-4975-ac4a-80e9566dddf9" class=" ">직물 시트 관리 방법</h3>
          <p class=" ">진공 청소기를 사용해 정기적으로 직물 시트를 청소하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">음료 얼룩 등으로 오염된 경우 적절한 인테리어용 세정제를 사용해 세척하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">직물 표면이 손상되지 않도록, 부드러운 스펀지나 극세사 천을 이용해 봉제선까지 넓은 범위로 부드럽게 닦아 내십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">올 풀림, 긁힘 등의 손상을 방지하려면 날카롭고 뾰족한 물체나 의류의 벨크로(찍찍이) 소재에 닿지 않도록 주의하십시오.</p>
            </li>
          </ul>
        </div>
