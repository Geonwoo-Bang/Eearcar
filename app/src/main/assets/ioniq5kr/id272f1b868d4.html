          <h3 id="64ca1993-ea54-48a0-a52a-81acb09dd0e1" class=" ">재생 방법</h3>
          <ol class=" ">
            <li class=" ">
              <p class=" ">안전을 위해 변속단을 &#x27;P&#x27;(주차)에 두십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">자세가 저장되어 있는 모드 버튼을 터치한 후, &#x27;적용&#x27; 버튼을 터치하십시오. 해당 모드에 저장된 위치로 좌석이 이동합니다.</p>
            </li>
            <li class=" ">
              <p class=" ">좌석 이동 중 작동을 멈추려면 &#x27;중지&#x27; 버튼을 누르십시오.</p>
            </li>
          </ol>
