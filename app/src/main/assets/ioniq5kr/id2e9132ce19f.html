<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>주행 중 고장 발생 시</title><div id="content-hyundai" class="content">
        <div id="id2e9132ce19f" lang="ko" class="ditatopic topiclevel-3  ">
          <h3 id="85531c63-8079-42fb-8334-0d74ec4c1826" class=" ">주행 중 고장 발생 시</h3>
          <p class=" ">주행 중 차량 고장이 발생한 경우 도로변에 정차한 후 비상 경고등을 켜 2차 사고를 방지하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">고속도로나 자동차 전용 도로에서는 차량 뒤쪽에 안전삼각대를 설치하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">직접 차량을 점검하고 수리할 수 있는 경우, 다른 차량의 통행에 주의해 작업하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">직접 차량을 수리할 수 없는 경우, 당사 직영 하이테크센터나 블루핸즈에 연락하십시오.</p>
            </li>
          </ul>
          <div type="warning" class=" note ">
            <p class=" ">터널에서 정차하는 것은 매우 위험합니다. 터널 이외의 구간에 차량을 정차하십시오.</p>
          </div>
        </div>
