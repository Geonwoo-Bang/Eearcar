          <h2 id="id221HB0QK0MW" class=" ">원격 스마트 주차 보조 2 (RSPA 2)</h2>
          <p class=" ">원격 스마트 주차 보조는 차량 센서를 이용하여 주차 공간을 탐색하고 스티어링 휠, 속도, 변속을 자동으로 제어하여 주차 및 출차를 도와줍니다.</p>
          <p class=" ">운전자가 차량 밖에서 차량을 전/후진 또는 후진 직각/평행 주차할 수 있도록 도와주고, 차량 안에서도 후진 직각/평행 주차 또는 평행 출차 할 수 있도록 도와줍니다.</p>
          <div type="note" class=" note ">
            <p class=" ">RSPA는 Remote Smart Parking Assist의 약자입니다.</p>
          </div>
