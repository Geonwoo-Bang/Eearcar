          <h3 id="ae20bc98-1dc3-4505-b6bf-9644524e1583" class=" ">시동이 꺼진 경우</h3>
          <p class=" ">적절한 방법을 이용해 차량을 안전한 곳으로 이동하십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">시동이 꺼지면 브레이크의 제동 능력이 감소하므로 브레이크 페달을 평소보다 세게 밟으십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">파워 스티어링 장치가 작동하지 않아 스티어링 휠 조작이 어려워지므로, 평소보다 강한 힘으로 조향하십시오.</p>
            </li>
          </ul>
