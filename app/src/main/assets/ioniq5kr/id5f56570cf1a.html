          <h3 id="69a7f9e5-df14-40c0-99c0-b8b16d0abc9b" class=" ">견인 관련 유의 사항</h3>
          <figure class=" ">
            <img src="media/15c295a878a600bd0a62e18d.png" class=" ">
            <p class=" ">2C_TowingWarning</p>
          </figure>
          <p class=" ">반드시 4륜을 모두 들어 올려서 견인하거나 돌리(바퀴 달린 수레)를 사용하여 견인하십시오.</p>
          <p class=" ">차량 견인에 관한 자세한 내용은 8장 내 &#x27;<a href="emergency_situations_towing.html#title_ayx_rx4_k1c" class=" Cross-Reference fm:Title ">차량을 견인해야 할 때</a>&#x27;을 참고하십시오.</p>
          <div type="caution" class=" note ">
            <p class=" ">4WD 차량은 일반 견인 트럭으로 견인할 수 없습니다. 반드시 4륜을 들어 올려 견인하십시오.</p>
          </div>
        </div>
