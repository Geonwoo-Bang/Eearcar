<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>전방 차량 출발 알림 설정</title><div id="content-hyundai" class="content">

          <h3 id="c9f3e621-d787-450d-ab03-38b3583fba3d" class=" ">전방 차량 출발 알림 설정</h3>
          <section id="section_lrv_x3p_b1c" class=" ">
            <div class=" title ">전방 차량 출발 알림</div>
            <figure id="fig_ukp_y3p_b1c" class=" ">
              <img id="image_vkp_y3p_b1c" src="media/2da10d6f887822c7b20f57fc.png" class=" ">
              <p class=" ">2C_LeadingVehicleDepartureSettings</p>
            </figure>
            <p class=" ">시동 &#x27;ON&#x27; 상태에서 인포테인먼트 시스템의 <span class=" uicontrol ">설정</span> → <span class=" uicontrol ">차량</span> → <span class=" uicontrol ">운전자 보조</span> → <span class=" uicontrol ">운전자 주의 경고</span> 를 차례로 선택하십시오.</p>
            <ul id="ul_dhc_bjp_b1c" class=" ">
              <li class=" ">
                <p class=" ">
                  <b class=" ">전방 차량 출발 알림</b>: 정차 중에 전방 차량이 출발했을 때 알려줍니다. </p>
              </li>
            </ul>
            <div id="note_vhd_kzn_41c" type="warning" class=" note ">
              <p class=" ">반드시 안전한 곳에 정차한 후 운전자 주의 경고를 설정하십시오.</p>
            </div>
          </section>
