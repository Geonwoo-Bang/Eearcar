          <h2 id="8b7571c1-92af-4b11-803e-b576ac3d5a65" class=" ">전좌석 메모리 시트</h2>
          <p class=" ">전좌석 메모리 시트 기능은 사전에 각 좌석의 위치를 저장해두고, 실행 버튼을 누르면 저장된 위치로 좌석이 조절되는 기능입니다. 상황에 맞게 좌석을 조절하여 편리하게 사용할 수 있습니다.</p>
          <div type="warning" class=" note ">
            <p class=" ">반드시 안전한 곳에 차를 정차한 후, 변속단을 &#x27;P&#x27;(주차)에 둔 상태에서 전좌석 메모리 시트 기능을 사용하십시오.</p>
          </div>
          <div type="caution" class=" note ">
            <p class=" ">전좌석 메모리 시트 기능은 많은 양의 전기 동력을 필요로 합니다. 배터리가 방전되지 않도록 시동이 꺼진 상태에서는 되도록 사용을 자제하십시오.</p>
          </div>
