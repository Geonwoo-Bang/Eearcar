          <h3 id="a88f8a98-658d-4854-a67d-4535a882331a" class=" ">정비 관련 유의 사항</h3>
          <ul class=" ">
            <li class=" ">
              <p class=" ">리프트로 차량을 들어 올린 상태에서 점검할 경우, 앞바퀴 또는 뒷바퀴 어느 한쪽만 구동시키지 마십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">리프트로 차량을 들어 올린 상태에서 차량을 구동시켜야 할 경우에는 반드시 파킹 브레이크를 푸십시오. 그렇지 않으면 4륜구동 장치에 고장이 발생할 수 있습니다.</p>
            </li>
          </ul>
