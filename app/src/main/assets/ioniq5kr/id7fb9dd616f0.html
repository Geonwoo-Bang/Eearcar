          <h3 id="eaff7d0f-7196-4a24-8b4c-849081f55736" class=" ">브레이크 제동력이 약한 경우</h3>
          <p class=" ">브레이크 제동력이 약한 경우, 브레이크 페달을 강하게 밟고 주차 브레이크를 함께 작동해 속도를 줄이십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">차량을 안전한 장소에 정차한 후 당사 직영 하이테크센터나 블루핸즈에 연락하십시오.</p>
            </li>
          </ul>
          <div type="warning" class=" note ">
            <p class=" ">브레이크 제동력이 약한 상태로 주행을 계속하지 마십시오. 브레이크 제동력이 감소한 상태에서 주행하는 것은 매우 위험합니다.</p>
          </div>
