          <h3 id="f05bce86-8c17-41fa-8faf-d542a50da043" class=" ">후측방 모니터 작동</h3>
          <figure id="fig_rts_rqm_j1c" class=" ">
            <div class=" title ">방향지시등 스위치</div>
            <figgroup class=" ">
              <img id="image_lsd_wqm_j1c" src="media/b17afb8e13ffc4ec7f978969.png" class=" ">
            </figgroup>
            <p class=" ">2C_BVMTurnSignal</p>

          <figure class=" ">

            <p class=" ">2C_BVMLeftSideInfo</p>
          </figure>
          <p class=" ">후측방 모니터는 좌측 또는 우측 방향지시등이 켜지면 해당 방향의 후측방 영상을 클러스터에 표시합니다.</p>
          <p class=" ">후측방 모니터는 다음의 조건 중 하나가 해당되면 해제됩니다.</p>
          <ul id="ul_zps_mqm_j1c" class=" ">
            <li class=" ">
              <p class=" ">작동 중인 방향지시등이 꺼짐</p>
            </li>
            <li class=" ">
              <p class=" ">비상 경고등이 켜짐</p>
            </li>
            <li class=" ">
              <p class=" ">클러스터에 다른 주요 정보가 표시</p>
            </li>
          </ul>
        </div>
