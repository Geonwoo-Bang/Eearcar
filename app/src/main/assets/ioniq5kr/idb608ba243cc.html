          <h3 id="277da8da-56c5-499a-a7c6-f3deae3faafd" class=" ">사고 또는 고장 발생 시</h3>
          <ol class=" ">
            <li class=" ">
              <p class=" ">즉시 비상 경고등을 켜고 갓길로 이동해 정차하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">차량 뒤에 안전삼각대를 설치하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">탑승자와 함께 가드레일 외부 등 안전한 장소로 대피하십시오.</p>

            <li class=" ">
              <p class=" ">경찰서(112), 소방서(119) 또는 한국도로공사(1588-2504)로 연락해 도움을 요청하십시오.</p>
