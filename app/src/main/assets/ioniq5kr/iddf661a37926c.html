<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>스마트 회생 제동 켜기</title><div id="content-hyundai" class="content">
        <div id="iddf661a37926c" lang="ko" class="ditatopic topiclevel-3  ">
          <h3 id="e9883c4a-31e9-4feb-b277-c20acbd00b67" class=" ">스마트 회생 제동 켜기</h3>
          <p class=" ">주행 중(변속기 위치 D) 회생 제동 감소 레버(<userinput class=" ">²</userinput>)를 1초 이상 당기면 스마트 회생 제동 기능이 켜집니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">클러스터의 회생 제동 단계 표시등이 &#x27;AUTO&#x27;로 변경됩니다.</p>
              <figure class=" ">
                <img src="media/b9485437889738b035660f50.png" class=" ">
                <p class=" ">2C_RegenerationBrakeLevel_1</p>
              </figure>
            </li>
            <li class=" ">
              <p class=" ">스마트 회생 제동 작동 중 회생 제동 증가 레버(<userinput class=" ">°</userinput>)를 0.5초 이상 당긴 채 유지하면 원 페달 드라이빙 기능을 사용할 수 있습니다(&#x27;<a href="id9beba88eac3.html#title_vzw_rkn_m1c" class=" Cross-Reference fm:Title ">원 페달 드라이빙 사용하기</a>&#x27; 참고).</p>
            </li>
          </ul>
        </div>
