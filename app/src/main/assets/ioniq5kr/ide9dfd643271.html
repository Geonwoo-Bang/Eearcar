          <h3 id="387ebb14-baa6-4eaf-865e-8ce34c89bada" class=" ">뒷유리 서리 제거하기</h3>
          <figure class=" ">
            <img src="media/0d5edd56a48bdba341d211c2.png" class=" ">
            <p class=" ">2C_RearWindowDefrost</p>
          </figure>
          <p class=" ">시동을 건 상태에서 뒷유리 서리 제거 버튼을 누르십시오.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">버튼 표시등이 켜지고 뒷유리 열선이 약 20분 동안 켜집니다.</p>
            </li>
            <li class=" ">
              <p class=" ">버튼을 한 번 더 누르면 즉시 열선이 꺼집니다.</p>
            </li>
            <li class=" ">
              <p class=" ">기능 작동 중 시동을 껐다 걸면 뒷유리 서리 제거 기능이 꺼진 상태로 유지됩니다.</p>
            </li>
          </ul>
