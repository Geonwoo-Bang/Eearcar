          <h1 id="030938f0-88c8-4740-8b36-4a9f3c8d520c" class=" ">차량 살펴보기</h1>
          <p class=" ">이 장에서는 차량의 각부 명칭과 조작부 위치, 제원, 식별 정보를 설명합니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">기능을 사용하기 전에 각 기능 설명과 함께 제공된 안전정보를 숙지하고 안전하게 기능을 사용하십시오.</p>
            </li>
          </ul>
          <div type="note" class=" note ">
            <ul class=" ">

              </li>
              <li class=" ">
                <p class=" ">사용자 차량의 사양에 따라 설명에 포함된 일부 기능이 제공되지 않을 수 있습니다.</p>
