        <div id="safety" lang="ko" class="ditatopic topiclevel-1  ">
          <h1 id="8b806b3f-186a-44e5-b645-c568a3c6a300" class=" ">시트 및 안전 장치</h1>
          <p class=" ">이 장에서는 차량 내부에 설치된 시트 및 안전장치의 사용법을 설명합니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">기능을 사용하기 전에 각 기능 설명과 함께 제공된 안전정보를 숙지하고 안전하게 기능을 사용하십시오.</p>
            </li>
          </ul>
          <div type="note" class=" note ">
            <ul class=" ">
              <li class=" ">
                <p class=" ">이 문서에 포함된 차량 및 부품 이미지는 예시를 위해 제공되는 것으로, 실제 차량 또는 부품과 다를 수 있습니다.</p>
              </li>
              <li class=" ">
                <p class=" ">사용자 차량의 사양에 따라 설명에 포함된 일부 기능이 제공되지 않을 수 있습니다.</p>
              </li>
            </ul>
          </div>
