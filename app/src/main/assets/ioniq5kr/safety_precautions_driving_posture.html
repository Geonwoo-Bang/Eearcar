          <h2 id="9e5b05a9-6cd2-4055-835c-db7718c59276" class=" ">바람직한 운전 자세</h2>
          <div type="warning" class=" note ">
            <ul class=" ">
              <li class=" ">
                <p class=" ">주행 중에는 시트, 스티어링 휠, 미러를 조절하지 마십시오.</p>
              </li>
              <li class=" ">
                <p class=" ">운전할 때 하이힐 등 페달 조작에 적합하지 않은 신발을 신지 마십시오. 가속 페달, 브레이크 페달 등의 조작 능력이 저하되어 사고가 발생할 수 있습니다.</p>
              </li>
              <li class=" ">
                <p class=" ">주차 브레이크를 해제하기 전에 반드시 브레이크 페달을 밟으십시오. 차량이 갑자기 움직이는 경우 사고가 발생할 수 있습니다.</p>
              </li>
            </ul>
