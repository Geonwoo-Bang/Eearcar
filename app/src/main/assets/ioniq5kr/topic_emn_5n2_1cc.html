          <h3 id="3e66c2c8-b5e7-40c3-89f9-d8781fde4d24" class=" ">사고기록장치 세부 안내문(제30조의3 제1항 관련)</h3>
          <p class=" ">이 자동차에는 사고기록장치가 장착되어 있습니다.</p>
          <p class=" ">사고기록장치는 자동차의 충돌 등 사고 전후 일정 시간동안 자동차의 운행 정보(주행속도, 제동페달, 가속페달 등의 작동 여부)를 저장하고, 저장된 정보를 확인할 수 있는 기능을 하는 장치를 말합니다.</p>
          <p class=" ">사고기록정보는 사고 상황을 좀 더 잘 이해하는 데 도움이 됩니다.</p>
        </div>
