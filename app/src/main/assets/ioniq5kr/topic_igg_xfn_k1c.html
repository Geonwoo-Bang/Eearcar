<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>슬라이딩 콘솔</title><div id="content-hyundai" class="content">
        <div id="topic_igg_xfn_k1c" class="ditatopic topiclevel-3  ">
          <h3 id="0f764a80-2641-4f61-9a5d-2154891a9414" class=" ">슬라이딩 콘솔</h3>
          <figure id="fig_ngg_xfn_k1c" class=" ">
            <img id="image_ogg_xfn_k1c" src="media/4e18e4d64eabfdb29e55f868.png" class=" ">
            <p class=" right ">2C_SlidingArmrest</p>
          </figure>
          <p class=" ">레버(1)를 누르고 앞/뒤(2)로 힘을 주어 밀거나 당기면 콘솔박스를 이동시킬 수 있습니다.</p>
          <p class=" ">슬라이딩 타입의 중앙 콘솔 박스를 이동 시킨 뒤, 콘솔박스가 &#x27;딸깍&#x27; 하며 고정되는 소리가 나는지 확인하십시오.</p>
          <div type="caution" id="note_pgg_xfn_k1c" class=" note ">
            <p class=" ">슬라이딩 타입의 중앙 콘솔 박스를 과도한 힘으로 이동시키면 콘솔박스 레일 또는 레버가 손상될 수 있습니다. </p>
          </div>
          <div type="warning" id="note_qgg_xfn_k1c" class=" note ">
            <p class=" ">차가 움직이는 동안에는 슬라이딩 콘솔을 움직이지 마십시오. 급정차나 충돌 시 위험할 수 있습니다.</p>
          </div>
        </div>
