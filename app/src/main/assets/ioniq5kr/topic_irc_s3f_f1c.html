<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>가죽 시트 사용 시 주의사항</title><div id="content-hyundai" class="content">
        <div id="topic_irc_s3f_f1c" class="ditatopic topiclevel-3  ">
          <h3 id="c354d6ab-04bb-44e2-b21a-83ee0394ec46" class=" ">가죽 시트 사용 시 주의사항</h3>
          <ul id="ul_jrc_s3f_f1c" class=" ">
            <li class=" ">
              <p class=" ">수분과 접촉하는 경우 천연 가죽 소재의 특성이 변할 수 있으므로 주의하십시오. 가죽이 물기에 젖은 경우 마른 천으로 물기를 제거하고 그늘에서 건조하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">가죽 표면의 손상을 방지하려면 날카로운 물체가 가죽 표면에 접촉하지 않도록 주의하십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">밝은 색상의 천연 가죽은 쉽게 오염되거나 이염될 수 있으므로 주의하십시오.</p>
            </li>
          </ul>
          <div type="note" id="note_krc_s3f_f1c" class=" note ">
            <p class=" ">가죽 시트 관리 방법에 대한 자세한 설명은 &#x27;<a href="id23C3K0006LK.html#id23C3K0006LK" class=" Cross-Reference fm:Title ">차량에 사용된 가죽 제품의 특성</a>&#x27; 및 &#x27;<a href="maintenance_interior_care.html#maintenance_interior_care" class=" Cross-Reference fm:Title ">차량 내부 관리</a>&#x27;를 참고하십시오.</p>
          </div>
        </div>
