          <h3 id="90dc6047-615d-482b-88f3-70a2198215f9" class=" ">내비게이션 기반 스마트 크루즈 컨트롤 설정</h3>
          <section id="section_umt_3jl_c1c" class=" ">

              <p class=" ">2C_NSCCSettings</p>
            </figure>
            <p class=" ">시동 &#x27;ON&#x27; 상태에서 인포테인먼트 시스템의 <span class=" uicontrol ">설정</span> &gt; <span class=" uicontrol ">차량</span> &gt; <span class=" uicontrol ">운전자 보조</span> &gt; <span class=" uicontrol ">주행 편의</span> &gt; <span class=" uicontrol ">고속도로 주행속도 자동 조절</span>을 차례로 선택하십시오. 내비게이션 기반 스마트 크루즈 컨트롤이 켜집니다.</p>
            <div id="note_gbh_ljl_c1c" type="note" class=" note ">
              <p class=" ">내비게이션 기반 스마트 크루즈 컨트롤에 이상이 발생한 경우 설정 메뉴에서 기능을 설정할 수 없습니다.</p>
