          <h3 id="1b4f42e1-516c-4380-a502-ab3b2dc07428" class=" ">주행 중 도어 잠금 유지</h3>
          <ul id="ul_mjs_gh4_rzb" class=" ">
            <li class=" ">
              <p class=" ">주행 중에는 도어를 잠긴 상태로 유지하십시오. 어린이 또는 탑승자가 무심코 안쪽 도어 핸들을 당기는 경우 도어가 열릴 수 있습니다.</p>
            </li>
            <li class=" ">
              <p class=" ">테일게이트가 열린 상태로 주행하지 마십시오. 차량이 손상될 수 있으며, 테일게이트의 화물이 도로로 낙하하는 경우 재산 손실 및 심각한 사고를 유발할 수 있습니다.</p>
            </li>
          </ul>
