<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>지능형 헤드램프 작동</title><div id="content-hyundai" class="content">
        <div id="topic_zvk_kdw_25b" class="ditatopic topiclevel-3  ">
          <h3 id="83c68e21-72a8-4131-9840-fa51ed5105de" class=" ">지능형 헤드램프 작동</h3>
          <figure id="fig_skr_dl4_k1c" class=" ">
            <img id="image_mzw_dl4_k1c" src="media/6951279ae9f8eaf1b1fe5026.png" class=" ">
            <p class=" ">2C_HBASwitch</p>
          </figure>
          <ol id="ol_iyb_mdw_25b" class=" ">
            <li class=" ">
              <p class=" ">조명 스위치를 AUTO(자동 켜짐) 위치로 돌리십시오.</p>
            </li>
            <li class=" ">
              <p class=" ">조명 스위치를 클러스터 방향으로 밀면 클러스터에 지능형 헤드램프(<userinput class=" ">Z</userinput>) 표시등이 켜집니다.</p>
            </li>
            <li class=" ">
              <p class=" ">인포테인먼트 시스템의 설정 메뉴에서 선택한 속도 조건에 따라 지능형 헤드램프가 작동합니다.</p>
              <p class=" ">지능형 헤드램프의 초기 설정은 40 km/h 이상 작동으로 되어있습니다.</p>
            </li>
          </ol>
        </div>
