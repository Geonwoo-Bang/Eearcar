          <h2 id="a992bdc1-6f30-452d-bbbc-06d1f18e30f9" class=" ">오픈소스 소프트웨어 정보</h2>
          <p class=" ">이 차량에는 오픈소스 라이선스가 적용된 소프트웨어가 탑재되어 있습니다.</p>
          <ul class=" ">
            <li class=" ">
              <p class=" ">소스 코드 및 오픈소스 라이선스 정보는 다음 주소에서 확인할 수 있습니다: https://www.hyundai.com/worldwi de/opensource</p>
            </li>
            <li class=" ">
              <p class=" ">최초 구매 후 3년 이내에는 이메일(opensource@hyundai.com)을 통해 오픈소스 코드가 담긴 저장 매체를 요청할 수 있습니다. 이 때, 최소한의 필요 경비가 청구됩니다.</p>
            </li>
          </ul>
