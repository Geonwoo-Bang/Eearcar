<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="reader.css"><title>경고등 및 표시등 확인하기</title><div id="content-hyundai" class="content">
        <div id="warning_indicator_lights" lang="ko" class="ditatopic topiclevel-2  ">
          <h2 id="title_pbh_q1n_k1c" class=" ">경고등 및 표시등 확인하기</h2>
          <p class=" ">주행 전 또는 주행 중 차량의 상태에 따라 경고등과 표시등이 클러스터에 표시됩니다.</p>
          <p class=" ">다음 내용을 참고해 차량에 표시되는 경고등과 표시등의 의미를 정확히 이해하고 차량을 안전하게 주행하십시오.</p>
          <div type="caution" class=" note ">
            <p class=" ">주행 중 경고등이 표시되거나 경고등 표시가 지속되면 가까운 당사 직영 하이테크센터나 블루핸즈에서 차량을 점검하거나 정비하십시오.</p>
          </div>
          <div id="note_mfl_gg2_2jc" class=" note ">
            <p class=" ">차량의 사양 및 소프트웨어 버전에 따라 경고등 및 표시등의 모양과 위치가 다를 수 있습니다.</p>
          </div>
